<title>高雄 ARIRANG 之旅</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style id="css">
/* Layout: one 600px column. Dark concert-ticket header, then a sticky section bar, then day cards with a date rail. */
:root{
 --bg:#F3F1F6;--card:#FFFFFF;--ink:#1D1924;--ink2:#3B3546;--muted:#756E80;--line:#E6E2EC;
 --accent:#5A3E9E;--accent-ink:#3F2A78;--wash:#EFEAF9;--show:#C8364A;--ok:#2E8577;--sea:#2D6FA8;
 --display:"Noto Serif TC","Songti TC",serif;--body:"Noto Sans TC",-apple-system,"PingFang TC",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
 color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
button,a,input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:600px;margin:0 auto;padding:16px 16px 96px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ticket */
.ticket{background:var(--ink);color:#F4F0FA;border-radius:22px;position:relative;overflow:hidden;box-shadow:0 18px 40px -22px rgba(40,20,80,.55)}
.ticket .glow{position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,rgba(122,92,206,.45),transparent 55%);pointer-events:none}
.tmain{position:relative;padding:20px 22px 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:#B9A6E8;text-transform:uppercase}
.ticket h1{font-family:var(--display);font-weight:900;font-size:34px;line-height:1.15;margin:8px 0 6px;letter-spacing:.04em;text-wrap:balance}
.tmeta{font-size:13px;color:#CBC3D8}
.cd{text-align:right}
.cd .n{font-family:var(--display);font-weight:900;font-size:52px;line-height:.9;color:#fff}
.cd .l{font-size:12px;color:#CBC3D8;margin-top:6px}
.stub{position:relative;border-top:2px dashed rgba(255,255,255,.16);padding:14px 16px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stub::before,.stub::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.stub::before{left:-11px}.stub::after{right:-11px}
.show{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;color:inherit;text-align:left;cursor:pointer}
.show .d{font-family:var(--mono);font-weight:600;font-size:15px}
.show .s{font-size:11px;color:#B3AAC2}
.show.today{background:var(--show);border-color:var(--show)}
.show.today .s{color:#fff}
.show.past{opacity:.45}
.show.past .d{text-decoration:line-through}

/* next up */
.next{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.next .tag{grid-row:span 2;align-self:stretch;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--wash);border-radius:12px;padding:6px 12px;min-width:68px}
.next .tag b{font-family:var(--mono);font-size:18px;color:var(--accent-ink)}
.next .tag small{font-size:10px;letter-spacing:.14em;color:var(--accent);font-family:var(--mono)}
.next .k{font-size:12px;color:var(--muted)}
.next .x{font-weight:700;font-size:15px;line-height:1.4}
.next .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* tabs */
.tabs{position:sticky;top:0;z-index:30;margin:14px -16px 0;padding:10px 16px;background:rgba(243,241,246,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tabs nav{display:grid;grid-template-columns:repeat(5,1fr);background:#E7E3EE;border-radius:12px;padding:3px}
.tabs a{text-align:center;text-decoration:none;color:var(--ink2);font-size:13px;font-weight:500;padding:7px 0;border-radius:9px;transition:background .2s,color .2s}
.tabs a.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(30,20,50,.12)}

section{margin-top:34px;scroll-margin-top:70px}
.sh{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px}
.sh .i{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.sh h2{margin:0;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.03em}
.sh .en{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:10px}
.big{font-size:17px;font-weight:700}
.sub{font-size:14px;color:var(--muted)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;text-align:center;text-decoration:none;font-size:14px;font-weight:700;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.note{margin-top:12px;background:var(--wash);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--accent-ink);line-height:1.65}
.note b{font-family:var(--mono);font-size:11px;letter-spacing:.14em;margin-right:6px;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--card);cursor:pointer;text-decoration:none;line-height:1.4}
.chip.solid{background:var(--show);border-color:var(--show);color:#fff}
.chip.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.static{cursor:default}

/* days */
.days-list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.day{display:grid;grid-template-columns:62px 1fr;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.day.today{border:2px solid var(--accent)}
.rail{background:var(--wash);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:2px;color:var(--accent-ink)}
.rail .mo{font-family:var(--mono);font-size:10px;letter-spacing:.16em}
.rail .dn{font-family:var(--display);font-weight:900;font-size:30px;line-height:1}
.rail .wk{font-size:12px}
.rail .flag{margin-top:8px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;background:var(--show);color:#fff;border-radius:4px;padding:1px 5px}
.day.showday .rail{background:var(--ink);color:#F4F0FA}
.day.today .rail .flag.t{background:var(--accent)}
.evs{list-style:none;margin:0;padding:6px 14px}
.evs li{display:grid;grid-template-columns:54px 1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.evs li:first-child{border-top:0}
.evs .t{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);padding-top:2px}
.evs .x{font-size:15px;line-height:1.5;min-width:0}
.evs .x.v{font-weight:700}
.evs .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mine{font-size:10px;font-weight:700;color:var(--accent-ink);background:var(--wash);border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:2px}
.dayhead{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.del{border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 4px;line-height:1}
.empty{color:var(--muted);font-size:14px;padding:12px 0}

/* map */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;border-radius:999px;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.filters button i{width:8px;height:8px;border-radius:50%;display:inline-block}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.mapbox{position:relative;background:#F2F0EC;border:1px solid var(--line);border-radius:20px;overflow:hidden;height:min(66vh,560px)}
.mapbox svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;font-family:var(--body)}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(30,20,50,.08)}
.mapctl button{width:38px;height:36px;border:0;border-top:1px solid var(--line);background:none;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer}
.mapctl button:first-child{border-top:0}
.maplegend{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.88);border-radius:8px;padding:3px 9px}
.pin{cursor:pointer}

/* list */
.grp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);margin:20px 2px 8px}
.grp i{width:8px;height:8px;border-radius:50%}
.grp span{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:11px;margin-left:auto}
.plist{padding:0 14px}
.prow{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
.prow:first-child{border-top:0}
.ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:700}
.nm{font-weight:700;font-size:15px;line-height:1.45}
.ds{font-size:13px;color:var(--muted);line-height:1.55;margin-top:2px}
.w{display:inline-block;font-size:11px;font-weight:600;background:#F1EFF4;color:var(--ink2);border-radius:6px;padding:1px 7px;margin-top:5px}
.added{font-size:10px;color:#fff;background:var(--accent);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,14,30,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:600px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px 18px 28px;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:86vh;overflow-y:auto;box-shadow:0 -12px 40px rgba(20,10,40,.18)}
.sheet.show{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-4px auto 14px}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px 2px 8px;background:#F1EFF4;color:var(--ink2)}
.cat i{width:8px;height:8px;border-radius:50%}
.sheet h3{margin:8px 0 6px;font-family:var(--display);font-weight:900;font-size:22px;line-height:1.3;text-wrap:balance}
.sheet .sub{white-space:pre-line;line-height:1.7}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);margin:16px 0 8px;text-transform:uppercase}
.dpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dpick button{font-size:14px;font-weight:700;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;line-height:1.3}
.dpick button small{font-weight:400;color:var(--muted)}
.dpick button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.dpick button.on small{color:#E3DAF7}
.inp{font-size:16px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;width:100%;color:var(--ink);font-family:inherit}
.sheet input[type=time]{font-size:16px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;width:100%;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:12px;background:#F7F5FA;border-radius:14px;padding:12px 14px}
.kv dt{font-size:12px;color:var(--muted);padding-top:3px}
.kv dd{margin:0;font-family:var(--mono);font-weight:600;font-size:16px}

/* timeline */
.vt{list-style:none;margin:10px 0 0;padding:0;position:relative}
.vt::before{content:"";position:absolute;left:75px;top:10px;bottom:10px;width:1px;background:var(--line)}
.vt li{display:grid;grid-template-columns:66px 1fr;gap:20px;padding:8px 0;position:relative}
.vt .vtm{text-align:right;font-family:var(--mono);font-weight:600;font-size:12px;line-height:1.5;color:var(--ink2);padding-top:2px}
.vt .vd{position:absolute;left:71px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.vt .vh{font-weight:700;font-size:15px;line-height:1.45}
.vt .vs{font-size:13px;color:var(--muted);line-height:1.6;margin-top:2px}
.vt li.hot .vd{background:var(--show);border-color:var(--show)}
.vt li.hot .vtm{color:var(--show)}

.ckrow{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.ckrow input,.ckbox{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border:1.5px solid #B9B2C4;border-radius:7px;display:grid;place-items:center;background:#fff;cursor:pointer}
.ckrow input:checked,.ckbox:checked{background:var(--ok);border-color:var(--ok)}
.ckrow input:checked::after,.ckbox:checked::after{content:"✓";color:#fff;font-size:13px;font-weight:900}
.ckrow:has(input:checked) b{color:var(--muted);text-decoration:line-through}
.prow:has(.ckbox:checked) .nm{color:var(--muted);text-decoration:line-through}
.prog{height:6px;border-radius:6px;background:#EEEBF2;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .3s}

.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.people .card{display:flex;flex-direction:column}
.av{width:36px;height:36px;border-radius:50%;background:var(--wash);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:16px;margin-bottom:8px}
.people .btns{margin-top:auto;padding-top:10px}
.people .btn{min-width:0}
.links .btn{display:flex;justify-content:space-between;text-align:left}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;transition:.25s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;font-family:var(--mono);letter-spacing:.12em}
@media (max-width:380px){.ticket h1{font-size:28px}.cd .n{font-size:42px}.people{grid-template-columns:1fr}}
</style>
</head>

   s+=`<line x1="${X(a.lng)}" y1="${Y(a.lat)}" x2="${X(b.lng)}" y2="${Y(b.lat)}" stroke="${col}" stroke-width="${2.6/z*Math.min(z,2.5)}" stroke-linecap="round" ${m==='walk'?'':`stroke-dasharray="${5/z} ${4/z}"`} opacity=".85"/>`;}
 }
 if(DAY){const col=DAYCOL[DAY];for(let i=0;i<dstops.length-1;i++){const a=dstops[i].p,b=dstops[i+1].p;
   s+=`<line x1="${X(a.lng)}" y1="${Y(a.lat)}" x2="${X(b.lng)}" y2="${Y(b.lat)}" stroke="${col}" stroke-width="${3/z*Math.min(z,2.5)}" stroke-linecap="round" opacity=".85"/>`;}}
 list.splice(0,list.length,...list.filter(p=>p.lat!=null));
 list.sort((a,b)=>(a.c==='base')-(b.c==='base'));
 list.forEach(p=>{const c=CATS[p.c], x=X(p.lng), y=Y(p.lat), rr=p.c==='base'?r*1.35:r;
  s+=`<g class="pin" data-open="${p.id}">`;
  s+=`<circle cx="${x}" cy="${y}" r="${rr*2.2}" fill="transparent"/>`;
  s+=`<circle cx="${x}" cy="${y+rr*0.25}" r="${rr*1.05}" fill="rgba(30,20,50,.18)"/>`;
  if(state.checked[p.id]) s+=`<circle cx="${x}" cy="${y}" r="${rr*1.9}" fill="#fff" stroke="#2E8577" stroke-width="${sw*1.6}"/>`;
  if(added.has(p.id)) s+=`<circle cx="${x}" cy="${y}" r="${rr*1.55}" fill="none" stroke="${c.c}" stroke-width="${sw*1.4}"/>`;
  s+=`<circle cx="${x}" cy="${y}" r="${rr}" fill="${c.c}" stroke="#fff" stroke-width="${sw*1.3}"/>`;
  const rn=DAY?dstops.map((x,i)=>x.p.id===p.id?i+1:0).filter(Boolean):filter==='route'?ROUTE.map((r,i)=>r.p===p.id?i+1:0).filter(Boolean):[];
  if(rn.length){s+=`<text x="${x}" y="${y+rr*0.4}" font-size="${rr*1.15}" font-weight="900" text-anchor="middle" fill="#fff" style="pointer-events:none">${rn.join('·')}</text>`;}
  else if(p.c==='base') s+=`<text x="${x}" y="${y+rr*0.38}" font-size="${rr*1.1}" text-anchor="middle" fill="#fff" style="pointer-events:none">★</text>`;
  if(p.c==='base'||z>=1.7||DAY||(filter==='route'&&(RIDS.has(p.id)&&z>=1.2))){const nm=p.n.replace(/（.*?）/g,'').replace(/「.*?」/,'');
   s+=`<text x="${x+rr*1.4}" y="${y+fs*0.35}" font-size="${p.c==='base'?fs*1.1:fs}" font-weight="${p.c==='base'?900:700}" fill="${p.c==='base'?'#1D1924':c.c}" paint-order="stroke" stroke="#F2F0EC" stroke-width="${3/z}" style="pointer-events:none">${esc(nm)}</text>`;}
  s+='</g>';
 });
 if(me){const mx=X(me.lng),my=Y(me.lat),rr=r*1.1,acc=Math.min((me.acc||50)/1000*K,W/4);
  s+=`<circle cx="${mx}" cy="${my}" r="${Math.max(acc,rr*2)}" fill="rgba(47,125,225,.12)" stroke="rgba(47,125,225,.35)" stroke-width="${sw}"/><circle cx="${mx}" cy="${my}" r="${rr}" fill="#2F7DE1" stroke="#fff" stroke-width="${sw*2}"/>`;
  s+=`<text x="${mx+rr*1.6}" y="${my+fs*0.35}" font-size="${fs*1.1}" font-weight="900" fill="#2F7DE1" paint-order="stroke" stroke="#F2F0EC" stroke-width="${3/z}" style="pointer-events:none">我</text>`;}
 svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
 svg.innerHTML=s;
}
function clampVB(){vb.w=Math.max(W/8,Math.min(W*1.05,vb.w));vb.h=vb.w*H/W;vb.x=Math.max(-W*0.1,Math.min(W*1.1-vb.w,vb.x));vb.y=Math.max(-H*0.1,Math.min(H*1.1-vb.h,vb.y));}
function zoomAt(f,cx,cy){const nw=vb.w/f;if(cx==null){cx=vb.x+vb.w/2;cy=vb.y+vb.h/2;}vb.x=cx-(cx-vb.x)*(nw/vb.w);vb.y=cy-(cy-vb.y)*(nw/vb.w);vb.w=nw;vb.h=nw*H/W;clampVB();renderMap();}
function toSvg(px,py){const r=svg.getBoundingClientRect();const sc=Math.max(vb.w/r.width,vb.h/r.height);const ox=(r.width*sc-vb.w)/2, oy=(r.height*sc-vb.h)/2;return {x:vb.x-ox+(px-r.left)*sc,y:vb.y-oy+(py-r.top)*sc,sc};}
const ptrs=new Map(); let moved=0, startDist=0, startW=0, downTarget=null;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;downTarget=e.target.closest('[data-open]');if(ptrs.size===2){const [a,b]=[...ptrs.values()];startDist=Math.hypot(a.x-b.x,a.y-b.y);startW=vb.w;}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);const cur={x:e.clientX,y:e.clientY};
 if(ptrs.size===1){const {sc}=toSvg(0,0);const dx=cur.x-prev.x,dy=cur.y-prev.y;moved+=Math.abs(dx)+Math.abs(dy);vb.x-=dx*sc;vb.y-=dy*sc;clampVB();svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);}
 ptrs.set(e.pointerId,cur);
 if(ptrs.size===2){moved+=10;const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const m=toSvg((a.x+b.x)/2,(a.y+b.y)/2);const nw=startW*startDist/d;zoomAt(vb.w/nw,m.x,m.y);}});
const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size===0){if(moved<8&&downTarget)openPlace(downTarget.dataset.open);else if(moved>=8)renderMap();downTarget=null;}};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();const m=toSvg(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.2:1/1.2,m.x,m.y);},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(1.5);
document.getElementById('zout').onclick=()=>zoomAt(1/1.5);
document.getElementById('zreset').onclick=()=>{vb={x:0,y:0,w:W,h:H};renderMap();};

const sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');

function openEdit(iso,id){const it=id?(state.plan[iso]||[]).find(x=>x.id===id):{t:'',x:'',p:'',q:'',k:''};if(!it)return;editCtx={iso,id};

 <div class="lbl"><label for="e_t">時間（可以打「散場後」這類文字）</label></div><input class="inp" id="e_t" value="${esc(it.t||'')}" placeholder="例如 14:30">
 <div class="lbl"><label for="e_x">內容</label></div><textarea class="inp" id="e_x" rows="2">${esc(it.x||'')}</textarea>

 <div class="lbl"><label for="e_q">或自訂 Google 地圖搜尋字（清單裡沒有的地點）</label></div><input class="inp" id="e_q" value="${esc(it.q||'')}" placeholder="例如 高雄 某某咖啡">
 <div class="btns"><button class="btn primary" data-esave="1">儲存</button>${id?'<button class="btn" data-edel="1" style="color:var(--show)">刪除</button>':''}</div>
 ${id?'<div class="btns"><button class="btn" data-emove="-1">↑ 上移</button><button class="btn" data-emove="1">↓ 下移</button></div>':''}
 <div class="btns"><button class="btn" id="closeS">取消</button></div>
 ${id?'':'<div class="note"><b>RESET</b>想回到建議版行程？<button class="chip" data-reset="1" style="margin-left:6px">恢復建議行程</button></div>'}`);

function saveEdit(){const e=editCtx;if(!e)return;const g=id=>document.getElementById(id);
 const nd=(sheet.querySelector('[data-eday].on')||{}).dataset?.eday||e.iso;
 const t=g('e_t').value.trim(), p=g('e_p').value, q=g('e_q').value.trim(); let x=g('e_x').value.trim();
 if(!x&&p&&PM[p])x=PM[p].n; if(!x&&q)x=q; if(!x){toast('請填內容');return;}
 let it;if(e.id){const a=state.plan[e.iso];const i=a.findIndex(z=>z.id===e.id);it=a[i];a.splice(i,1);}else it={id:newId(),k:''};
 Object.assign(it,{t,x,p,q});
 const arr=state.plan[nd];
 if(e.id&&nd===e.iso&&tkey(t)==='99:99'){arr.push(it);} else insertByTime(arr,it);

function openPlace(id){const p=PM[id];if(!p)return;const c=CATS[p.c];

 showSheet(`${catTag(c.c,c.n)}<h3>${esc(p.n)}</h3><div class="sub">${esc(p.d)}</div>
 <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><span class="chip static">${esc(p.w)}</span>${ins.length?`<span class="chip static ink">已在行程：${esc(ins.join('、'))}</span>`:''}</div>

 <div class="btns"><a class="btn primary" href="https://www.google.com/maps/dir/?api=1&amp;destination=${encodeURIComponent(p.q)}" target="_blank" rel="noopener">從我這裡導航 ↗</a><a class="btn" href="${esc(p.url||gmap(p.q))}" target="_blank" rel="noopener">Google 地圖 ↗</a>${id==='stadium'?'<button class="btn" data-venue="1">場館時間表</button>':''}</div>
 <div class="lbl">加入行程・選日期</div>
 <div class="dpick">${DAYS.map(d=>`<button data-day="${d[0]}" class="${d[0]===pickDay?'on':''}">${d[1]}<br><small>${d[2]}</small></button>`).join('')}</div>
 <div class="lbl"><label for="ptime">時間（可不填）</label></div><input type="time" id="ptime">
 <div class="btns"><button class="btn primary" data-add="${id}">加入行程</button></div>`);

 showSheet(`${catTag('var(--show)','11/22 回程')}<h3>B02 返鄉專車</h3><div class="sub">高雄世運主場館 → 雙北市（中和・板橋・新莊）｜宸遊旅行社・單程票 2 張</div>
 <ul class="vt">
  <li class="hot"><span class="vtm">散場後<br>45 分內</span><span class="vd"></span><span><div class="vh">上車：世運大道，依路線編號排隊</div><div class="vs">我們是 02 號線（第一班次 01–23），最後發車時間是演唱會結束後 45 分鐘。散場後照編號去上車口，所有上車口都不用穿越世運大道。</div></span></li>
  <li><span class="vtm">下車 1</span><span class="vd"></span><span><div class="vh">中和</div><div class="vs">中正路與連城路路口</div></span></li>
  <li><span class="vtm">下車 2</span><span class="vd"></span><span><div class="vh">板橋車站</div></span></li>
  <li><span class="vtm">下車 3</span><span class="vd"></span><span><div class="vh">新莊</div><div class="vs">捷運頭前庄站 02 號出口</div></span></li>
 </ul>
 <div class="lbl">散場上車位置（宸遊 11/16 公告）</div>
 <dl class="kv" style="font-family:inherit"><dt>01–07・51–57</dt><dd style="font-family:var(--body);font-size:14px">場館正前方廣場最<b>左邊（西側）</b>，靠服務台與行李寄放處 ← 02 號在這區</dd><dt>08–18・58–68</dt><dd style="font-family:var(--body);font-size:14px">廣場中間</dd><dt>19–23・69–73</dt><dd style="font-family:var(--body);font-size:14px">廣場右邊（東側）</dd></dl>

 <div class="btns"><button class="btn" id="closeS">關閉</button></div>`);
}

document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.ck;if(!id)return;if(e.target.checked)state.checked[id]=true;else delete state.checked[id];save();renderMap();renderRoute();renderFan();if(id.startsWith('g_')){renderList();toast(e.target.checked?'已存 ✓':'已取消');return;}toast(e.target.checked?'打卡 ✓':'已取消');});
document.addEventListener('click',async e=>{
 const t=e.target;
 if(t.closest('.ckbox')||t.closest('.ckrow')) return;
 const fm=t.closest('[data-fm]'); if(fm){fanMem=fm.dataset.fm;renderFan();return;}
 const gm=t.closest('[data-gmode]'); if(gm){gmode=gm.dataset.gmode==='1';renderList();document.getElementById('list').scrollIntoView({behavior:'smooth'});return;}
 const cp=t.closest('[data-copy]'); if(cp){try{await navigator.clipboard.writeText(cp.dataset.copy);toast('已複製');}catch(err){toast('無法複製，請長按文字');}return;}
 if(t.closest('[data-venue]')){openVenue();return;}
 if(t.closest('[data-bus]')){openBus();return;}
 if(t.closest('[data-hsr]')){openHsr();return;}
 if(t.id==='closeS'){closeSheet();return;}
 const edy=t.closest('[data-eday]'); if(edy){sheet.querySelectorAll('[data-eday]').forEach(b=>b.classList.toggle('on',b===edy));return;}
 const dy=t.closest('[data-day]'); if(dy){pickDay=dy.dataset.day;sheet.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('on',b===dy));return;}
 const ad=t.closest('[data-add]'); if(ad){const tm=(document.getElementById('ptime')||{}).value||'';
  insertByTime(state.plan[pickDay],{id:newId(),t:tm,x:PM[ad.dataset.add].n,p:ad.dataset.add,k:''});
  save();renderAll();closeSheet();const d=DAYS.find(x=>x[0]===pickDay);toast('已加入 '+d[1]+(tm?' '+tm:''));return;}
 const ed=t.closest('[data-edit]'); if(ed){const [iso,id]=ed.dataset.edit.split('|');openEdit(iso,id);return;}
 const ni=t.closest('[data-newitem]'); if(ni){openEdit(ni.dataset.newitem,null);return;}
 const sv=t.closest('[data-esave]'); if(sv){saveEdit();return;}
 const dv=t.closest('[data-edel]'); if(dv){const e=editCtx;state.plan[e.iso]=state.plan[e.iso].filter(x=>x.id!==e.id);save();renderAll();closeSheet();toast('已刪除');return;}
 const mv=t.closest('[data-emove]'); if(mv){const e=editCtx,a=state.plan[e.iso],i=a.findIndex(x=>x.id===e.id),j=i+(+mv.dataset.emove);if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderAll();toast(+mv.dataset.emove<0?'已上移':'已下移');return;}
 const rs=t.closest('[data-reset]'); if(rs){state.plan=JSON.parse(JSON.stringify(DEFAULT_PLAN));Object.values(state.plan).forEach(a=>a.forEach(it=>it.id=newId()));save();renderAll();closeSheet();toast('已恢復建議行程');return;}
 const f=t.closest('[data-f]'); if(f&&f.dataset.f==='me'){locate();if(f.dataset.gomap)document.getElementById('map').scrollIntoView({behavior:'smooth'});return;}
 if(f){filter=f.dataset.f;vb=filter.startsWith('day:')?dayVB(filter.slice(4)):filter==='route'?routeVB():filter==='fanzone'?fanVB():filter==='near'?nearVB():{x:0,y:0,w:W,h:H};renderList();renderMap();renderRoute();if(f.dataset.gomap)document.getElementById('map').scrollIntoView({behavior:'smooth'});return;}
 const op=t.closest('[data-open]'); if(op&&!svg.contains(op)){openPlace(op.dataset.open);return;}
});
